# Every installable piece of this project, one per line:
#
#   name : kind : default : description
#
# kind      overrides | adapter | shell | system
# default   on  installed by a plain ./install
#           off explicit --enable only (everything needing root is off)
overrides    : overrides : on  : Caelestia supported override points (hypr, shell.json, cli.json, fish)
foot         : overrides : on  : foot font size and cursor style
starship     : overrides : on  : starship scan timeout
zed          : overrides : on  : Zed uses the Caelestia theme Caelestia already writes for it
firefox      : overrides : on  : Caelestia's Firefox layout, into profiles its dots miss
voice        : overrides : off : PipeWire noise suppression for the microphone (WebRTC)
shell        : shell     : off : forked Caelestia shell and plugin (builds from source)
kde          : adapter   : on  : Dolphin/Ark colours, Qt and GTK fonts
gtk          : adapter   : on  : GTK colours through a generated theme, so open windows recolour live
cursor       : adapter   : on  : Sweet cursors in the scheme's colours
spotify      : adapter   : on  : re-apply spicetify after a theme change
papirus      : adapter   : on  : Papirus folder colours (needs sudoers)
sudoers      : system    : off : passwordless rule for papirus
sddm         : system    : off : Caelestia-styled SDDM login screen
