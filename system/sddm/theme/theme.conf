; Defaults. system/sddm/sync writes theme.conf.user beside this file with the
; current Caelestia scheme and wallpaper, and SDDM reads that over these.
[General]
BgSource=
mode=dark
useTwelveHourClock=false

; The greeter's own choice, not the shell's: true draws every surface solid,
; as the shell does with appearance.transparency off, whatever the desktop
; uses. The helper never writes this key, so theme.conf.user cannot change it.
solidSurfaces=true
