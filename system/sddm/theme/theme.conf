; Defaults. system/sddm/sync writes theme.conf.user beside this file with the
; current Caelestia scheme and wallpaper, and SDDM reads that over these.
[General]
BgSource=
mode=dark
useTwelveHourClock=false

; The greeter's own choice, not the shell's: which surfaces take the shell's
; translucency and blur (account, buttons, password, clock). The rest are
; solid, as the shell draws everything with appearance.transparency off, and so
; is everything when that is off. The helper never writes this key.
frostedSurfaces=account,buttons
