# Preview pane gets the larger share; caelestia's terminal is usually wide.
[mgr]
ratio          = [ 1, 3, 4 ]
sort_by        = "alphabetical"
sort_dir_first = true
sort_sensitive = false
linemode       = "size"
show_hidden    = false

[preview]
wrap          = "yes"
tab_size      = 4
max_width     = 900
max_height    = 900
image_filter  = "lanczos3"
image_quality = 85
