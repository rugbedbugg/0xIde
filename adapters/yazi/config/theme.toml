# Caelestia theme for yazi.
#
# Every colour here is an ANSI name rather than a hex value, and that is the
# whole point. Caelestia rewrites the terminal's 16-colour palette on every
# scheme change (apply_terms() pushes escape sequences to each open pty, and
# config.fish replays sequences.txt for new ones), so naming the slots makes
# yazi track the wallpaper automatically. Hardcoding hex would freeze it at
# whatever the scheme happened to be today.

[mgr]
cwd = { fg = "cyan" }

# reversed borrows the terminal's own fg/bg, so the cursor row picks up the
# scheme's surface colours instead of a fixed accent.
hovered         = { reversed = true, bold = true }
preview_hovered = { underline = true }

find_keyword  = { fg = "yellow", bold = true, italic = true }
find_position = { fg = "magenta", bg = "reset", italic = true }

marker_copied   = { fg = "lightgreen",  bg = "lightgreen" }
marker_cut      = { fg = "lightred",    bg = "lightred" }
marker_marked   = { fg = "lightcyan",   bg = "lightcyan" }
marker_selected = { fg = "lightyellow", bg = "lightyellow" }

count_copied   = { fg = "white", bg = "green" }
count_cut      = { fg = "white", bg = "red" }
count_selected = { fg = "white", bg = "yellow" }

border_symbol = "│"
border_style  = { fg = "darkgray" }
