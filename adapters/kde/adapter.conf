name = kde
description = Colours and fonts for KDE apps (Dolphin, Ark), Qt via qtengine, and GTK/Thunar
requires = python3
optional = dolphin, thunar, qt6ct-kde, dconf
privileges = none
writes = $XDG_CONFIG_HOME/kdeglobals, $XDG_CONFIG_HOME/qtengine/config.json, $XDG_CONFIG_HOME/gtk-3.0/settings.ini, $XDG_CONFIG_HOME/gtk-4.0/settings.ini, dconf org.gnome.desktop.interface fonts
