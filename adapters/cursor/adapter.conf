name = cursor
description = Rebuilds the Sweet cursor theme in the scheme's colours
requires = python3, rsvg-convert, xcursorgen
optional = hyprcursor-util, hyprctl, gsettings, sweet-cursors-git (AUR, the shapes it recolours)
privileges = none
writes = $XDG_DATA_HOME/icons/0xide-sweet/, $XDG_CONFIG_HOME/gtk-3.0/settings.ini, $XDG_CONFIG_HOME/gtk-4.0/settings.ini, gsettings org.gnome.desktop.interface cursor-theme and cursor-size, ~/.icons/default/index.theme (only when it inherits Sweet)
