name = gtk
description = Colours GTK through a generated theme, so open windows recolour without a restart
requires = python3, dconf
optional = adw-gtk3, thunar
privileges = none
writes = $XDG_DATA_HOME/themes/0xide-a/, $XDG_DATA_HOME/themes/0xide-b/, $XDG_CONFIG_HOME/gtk-3.0/{gtk,thunar}.css, $XDG_CONFIG_HOME/gtk-4.0/{gtk,thunar}.css, $XDG_CONFIG_HOME/gtk-3.0/settings.ini gtk-theme-name, dconf org.gnome.desktop.interface gtk-theme, color-scheme and icon-theme
