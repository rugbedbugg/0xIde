name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          git ls-files -z | while IFS= read -r -d '' f; do
              head -1 "$f" | grep -qE '^#!.*(bash|sh)' && printf '%s\0' "$f"
          done | xargs -0 shellcheck -S warning
      - name: Python byte-compiles
        run: git ls-files '*.py' 'system/sddm/sync' 'system/sddm/caelestia-sddm-sync' | xargs python3 -m py_compile

  test:
    # tests/run exercises Arch's own packages (sddm, qt6, visudo), so it runs on
    # Arch. It runs unprivileged: the installers refuse root, and a hostname and
    # user that appear nowhere in the tree keep the machine-value check honest.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: archlinux:base
      options: --hostname cm-ci-host
    steps:
      - uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed git rsync python jq lua sudo sddm qt6-declarative \
              tesseract tesseract-data-eng imagemagick
      - uses: actions/checkout@v4
      - name: Fetch the pinned upstream shell
        run: |
          url="$(sed -n 's/^[[:space:]]*url[[:space:]]*=[[:space:]]*//p' shell/upstream.pin)"
          rev="$(sed -n 's/^[[:space:]]*rev[[:space:]]*=[[:space:]]*//p' shell/upstream.pin)"
          git clone --quiet "$url" build/shell-src
          git -C build/shell-src cat-file -e "$rev^{commit}"
      - name: tests/run
        run: |
          useradd --create-home cmtester
          home="$(getent passwd cmtester | cut -d: -f6)"
          chown -R cmtester: "$GITHUB_WORKSPACE"
          runuser -u cmtester -- env HOME="$home" git config --global --add safe.directory '*'
          runuser -u cmtester -- env HOME="$home" ./tests/run
