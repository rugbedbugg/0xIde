# foot has no include or drop-in mechanism, and its foot.ini is deployed by the
# Caelestia dots. These keys are therefore rewritten in place, idempotently, by
# installer/apply_overlay.py. Only the keys named here are touched; a dots
# update that changes anything else is kept.
[main]
font = JetBrains Mono Nerd Font:size=9.5

[cursor]
style = underline
underline-thickness = 1.5
