# Installed by 0xIde (component: voice). A noise-suppressed microphone.
#
# PipeWire's own echo-cancel module with the WebRTC processor filters the
# default microphone into a new source, "Microphone (noise suppressed)":
# steady background noise is removed and quiet speech is brought up. Monitor
# mode takes the echo reference from the default output's monitor, so no extra
# output device appears. Remove this file and restart PipeWire to undo it.
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = true
            aec.args = {
                webrtc.high_pass_filter = true
                webrtc.noise_suppression = true
                webrtc.voice_detection = true
                webrtc.gain_control = true
                webrtc.extended_filter = false
                webrtc.delay_agnostic = true
            }
            capture.props = {
                node.name = "capture.0xide_voice"
                node.passive = true
            }
            source.props = {
                node.name = "0xide_voice"
                node.description = "Microphone (noise suppressed)"
            }
        }
    }
]
